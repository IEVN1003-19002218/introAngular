<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- 1. Sección de Operaciones Básicas por Botón -->
<div class="container mt-4">
  <div class="card p-4">
    <h3>Operaciones Básicas por botón</h3>
    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="num1_btn" class="form-label">Número 1</label>
          <input [(ngModel)]="num1" type="number" name="num1_btn" class="form-control" id="num1_btn" placeholder="Ingresa el número 1">
        </div>
        <div class="col-md-6">
          <label for="num2_btn" class="form-label">Número 2</label>
          <input [(ngModel)]="num2" type="number" name="num2_btn" class="form-control" id="num2_btn" placeholder="Ingresa el número 2">
        </div>
        <div class="col-12 mt-3">
          <button (click)="sumar()" type="button" class="btn btn-primary me-2">Sumar</button>
          <button (click)="restar()" type="button" class="btn btn-primary me-2">Restar</button>
          <button (click)="multiplicar()" type="button" class="btn btn-primary me-2">Multiplicar</button>
          <button (click)="dividir()" type="button" class="btn btn-primary">Dividir</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- 2. Sección de Operaciones Básicas con Radio Botón -->
<div class="container mt-4">
  <div class="card p-4">
    <h3>Operaciones Básicas con Radio Botón</h3>
    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="num1_radio" class="form-label">Número 1</label>
          <input [(ngModel)]="num1" type="number" name="num1_radio" class="form-control" id="num1_radio" placeholder="Ingresa el número 1">
        </div>

        <div class="col-md-6">
          <label for="num2_radio" class="form-label">Número 2</label>
          <input [(ngModel)]="num2" type="number" name="num2_radio" class="form-control" id="num2_radio" placeholder="Ingresa el número 2">
        </div>

        <div class="col-12 mt-3">
          <label class="form-label d-block fw-bold">Selecciona la operación:</label>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion_grupo" value="suma" [(ngModel)]="opcionSeleccionada" id="suma_radio">
            <label class="form-check-label" for="suma_radio">Suma</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion_grupo" value="resta" [(ngModel)]="opcionSeleccionada" id="resta_radio">
            <label class="form-check-label" for="resta_radio">Resta</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion_grupo" value="multiplicar" [(ngModel)]="opcionSeleccionada" id="multi_radio">
            <label class="form-check-label" for="multi_radio">Multiplicación</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion_grupo" value="dividir" [(ngModel)]="opcionSeleccionada" id="divdiv_radio">
            <label class="form-check-label" for="divdiv_radio">División</label>
          </div>
        </div>

        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary" (click)="calcular()">Calcular</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Resultados generales -->
<div class="container mt-3">
  <h2 *ngIf="opcionSeleccionada === 'suma'">Resultado Suma: {{ resultadosum }}</h2>
  <h2 *ngIf="opcionSeleccionada === 'resta'">Resultado Resta: {{ resultadores }}</h2>
  <h2 *ngIf="opcionSeleccionada === 'multiplicar'">Resultado Multiplicación: {{ resultadomulti }}</h2>
  <h2 *ngIf="opcionSeleccionada === 'dividir'">Resultado División: {{ resultadodiv }}</h2>
</div>
