<div class="container mt-4">

  <div class="card p-4">

    <h3>Inicio de sesión</h3>

    <div class="mb-3">
      <label class="form-label">Usuario</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="Usuario"
        name="Usuario"
        placeholder="Ingresa tu usuario"
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>

      <input
        type="password"
        class="form-control"
        [(ngModel)]="contrasena"
        name="contrasena"
        placeholder="Ingresa tu contraseña"
      >
    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="ValidarUsuario()"
    >
      Iniciar sesión
    </button>

    <div class="mt-4">
      <p>{{ Mensaje }}</p>
    </div>

  </div>

</div>
