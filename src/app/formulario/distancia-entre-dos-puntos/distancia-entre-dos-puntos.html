<div class="container mt-4">

  <div class="card p-4">

    <h3>Distancia entre dos puntos</h3>

    <form>

      <h5 class="mt-3">Punto 1</h5>

      <div class="row">

        <div class="col-md-6">
          <label class="form-label">X1</label>

          <input
            [(ngModel)]="x1"
            type="number"
            name="x1"
            class="form-control"
            placeholder="Ingresa X1"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">Y1</label>

          <input
            [(ngModel)]="y1"
            type="number"
            name="y1"
            class="form-control"
            placeholder="Ingresa Y1"
          >
        </div>

      </div>

      <h5 class="mt-4">Punto 2</h5>

      <div class="row">

        <div class="col-md-6">
          <label class="form-label">X2</label>

          <input
            [(ngModel)]="x2"
            type="number"
            name="x2"
            class="form-control"
            placeholder="Ingresa X2"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">Y2</label>

          <input
            [(ngModel)]="y2"
            type="number"
            name="y2"
            class="form-control"
            placeholder="Ingresa Y2"
          >
        </div>

      </div>

      <button
        (click)="CalcularDistancia()"
        type="button"
        class="btn btn-primary mt-4"
      >
        Calcular distancia
      </button>

    </form>

    <div class="mt-4">
      <h4>Distancia: {{ distancia }}</h4>
    </div>

  </div>

</div>
