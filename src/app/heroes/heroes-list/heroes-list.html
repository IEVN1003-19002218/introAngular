<div class="card">
  <div class="card-header">
    <h1>Heroes Dragon Ball</h1>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-2"></div>
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Ingrese nombre de heroe">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <h3>Filtro:</h3>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle" *ngIf="heroes.length > 0">
        <thead>
          <tr>
            <th>
              <button (click)="showImage()" class="btn btn-primary btn-sm">
                {{ muestraImagen ? 'Ocultar' : 'Mostrar' }}
              </button>
            </th>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Raza</th>
            <th>Ki</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let heroe of heroes">
            <td></td>
            <td>
              <img *ngIf="muestraImagen" [src]="heroe.imagen" [style.width.px]="imageWidth" [style.margin.px]="imageMargin" [alt]="heroe.nombre">
            </td>
            <td>{{ heroe.nombre }}</td>
            <td>{{ heroe.Descripcion }}</td>
            <td>{{ heroe.race }}</td>
            <td>{{ heroe.ki }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
